name: Content update (in-game download)

# Publishes the whole game as one update.pck on the `content-latest` release.
# Phones with the IPA installed download it on next launch — no reinstall.
# Start it from the Actions tab, or edit .github/content-update-trigger.
on:
  workflow_dispatch:
    inputs:
      rebase:
        description: "Rebuild the base pack (full download for newer IPAs)"
        type: boolean
        default: false
  push:
    branches: [master]
    paths: [".github/content-update-trigger"]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot + export templates
        run: |
          V=$GODOT_VERSION
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${V}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${V}.stable"
          mkdir -p "$T" && unzip -q templates.tpz -d tpl && cp -R tpl/templates/* "$T/"

      - name: Stamp version
        run: date +%s > build_version.txt

      - name: Update key (private repo only, read-only token from the UPDATE_TOKEN secret)
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # only ever inside a private repo's builds: a public release would leak the key
          if [ -n "$UPDATE_TOKEN" ] && [ "$REPO_PRIVATE" = "true" ]; then printf '%s' "$UPDATE_TOKEN" > update_token.txt; echo 'token added'; else echo 'no UPDATE_TOKEN secret: public update links'; fi

      - name: Import + export packs (iOS preset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./godot --headless --path . --import || true
          mkdir -p out base
          # full pack: older IPAs download this one
          ./godot --headless --path . --export-pack "iOS" out/update.pck
          # base + patch: newer IPAs keep the base and fetch only changed files
          gh release download content-latest -p base.pck -p base.json -D base 2>/dev/null || true
          REBASE=1
          if [ -f base/base.pck ] && [ -f base/base.json ] && [ "${{ github.event.inputs.rebase }}" != "true" ]; then
            ./godot --headless --path . --export-patch "iOS" out/patch.pck --patches "$PWD/base/base.pck" && REBASE=0
            if [ "$REBASE" = 0 ]; then
              P=$(stat -c %s out/patch.pck); B=$(stat -c %s base/base.pck)
              # patch grown past 40% of the base: start a fresh base
              [ $((P * 100 / B)) -gt 40 ] && REBASE=1
            fi
          fi
          if [ "$REBASE" = 1 ]; then
            cp out/update.pck out/base.pck
            printf '{"base_version": %s}\n' "$(cat build_version.txt)" > out/base.json
            rm -f out/patch.pck
          else
            cp base/base.pck out/base.pck
            cp base/base.json out/base.json
          fi
          echo "REBASE=$REBASE" >> $GITHUB_ENV
          ls -la out

      - name: Publish to release content-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat build_version.txt)
          SIZE=$(stat -c %s out/update.pck)
          R="https://github.com/${{ github.repository }}/releases/download/content-latest"
          BV=$(python3 -c "import json;print(json.load(open('out/base.json'))['base_version'])")
          BS=$(stat -c %s out/base.pck)
          if [ -f out/patch.pck ]; then PURL="$R/patch.pck"; PS=$(stat -c %s out/patch.pck); else PURL=""; PS=0; fi
          printf '{"version": %s, "size": %s, "url": "%s", "base_version": %s, "base_url": "%s", "base_size": %s, "patch_url": "%s", "patch_size": %s}\n' \
            "$VER" "$SIZE" "$R/update.pck" "$BV" "$R/base.pck" "$BS" "$PURL" "$PS" > out/manifest.json
          cat out/manifest.json
          gh release view content-latest >/dev/null 2>&1 || gh release create content-latest --title "Game content (in-game update)" --notes "Downloaded automatically by the game." --latest=false
          FILES="out/update.pck"
          [ "$REBASE" = 1 ] && FILES="$FILES out/base.pck out/base.json"
          [ -f out/patch.pck ] && FILES="$FILES out/patch.pck"
          gh release upload content-latest $FILES --clobber
          # manifest last, so phones never see it before the packs are there
          gh release upload content-latest out/manifest.json --clobber
